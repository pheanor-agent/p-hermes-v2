[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-hermes-reference"
version = "0.2.0"
description = "A local, inspectable five-domain agent systems reference runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
p-hermes = "p_hermes.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
