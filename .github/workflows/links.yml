name: Weekly external link check
on:
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check external links
        run: python3 -B tools/check_external_links.py
