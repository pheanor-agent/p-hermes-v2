name: Offline public site checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all offline example tests
        run: make test
      - name: Rebuild public site
        run: make build
      - name: Check links, slide rails, and privacy patterns
        run: make check
      - name: Check patch whitespace
        run: git diff --check
      - name: Check site JavaScript
        run: node --check site/assets/deck.js
