<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">LUMA — 교육용 데스크 램프 일러스트</title><desc id="desc">청록색 납작한 헤드와 가는 지지대, 타원 받침을 가진 램프. 따뜻한 빛이 책과 나무 책상을 비춘다. 실제 생성물이나 실제품이 아니다.</desc>
<defs>
